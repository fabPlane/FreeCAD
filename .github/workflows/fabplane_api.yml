#
# fabPlane: build the headless core with the FreeCAD API (src/Api) and run its tests.
# Kept separate from upstream's CI so it stays small: no GUI, only the modules the API serves.

name: FreeCAD API

on:
  workflow_dispatch: ~
  push:
    branches: [main]
    paths: ["src/Api/**", "src/Main/MainApi.cpp", "tests/src/Api/**", "cMake/**", ".github/workflows/fabplane_api.yml"]
  pull_request:
    paths: ["src/Api/**", "src/Main/MainApi.cpp", "tests/src/Api/**", "cMake/**", ".github/workflows/fabplane_api.yml"]

concurrency:
  group: fabplane-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Submodules the headless build needs
        run: git submodule update --init --depth 1 src/3rdParty/GSL
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache python3-dev python3-yaml libboost-all-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev \
            libocct-visualization-dev occt-misc libxerces-c-dev libeigen3-dev libyaml-cpp-dev \
            libfmt-dev pybind11-dev swig libvtk9-dev libfreetype-dev libharfbuzz-dev zlib1g-dev \
            libgtest-dev libgmock-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-api-${{ github.sha }}
          restore-keys: ccache-api-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPython3_EXECUTABLE=/usr/bin/python3 -DENABLE_DEVELOPER_TESTS=ON
          -DBUILD_GUI=OFF -DBUILD_API=ON -DBUILD_PART=ON -DBUILD_PART_DESIGN=ON -DBUILD_SKETCHER=ON
          -DBUILD_IMPORT=ON -DBUILD_MATERIAL=ON -DBUILD_MESH=ON -DBUILD_TEST=ON
          -DBUILD_FEM=OFF -DBUILD_ADDONMGR=OFF -DBUILD_BIM=OFF -DBUILD_DRAFT=OFF -DBUILD_HELP=OFF
          -DBUILD_INSPECTION=OFF -DBUILD_MESH_PART=OFF -DBUILD_FLAT_MESH=OFF -DBUILD_OPENSCAD=OFF
          -DBUILD_CAM=OFF -DBUILD_ASSEMBLY=OFF -DBUILD_PLOT=OFF -DBUILD_POINTS=OFF
          -DBUILD_REVERSEENGINEERING=OFF -DBUILD_ROBOT=OFF -DBUILD_SHOW=OFF -DBUILD_SPREADSHEET=OFF
          -DBUILD_START=OFF -DBUILD_MEASURE=OFF -DBUILD_TECHDRAW=OFF -DBUILD_TUX=OFF -DBUILD_WEB=OFF
          -DBUILD_SURFACE=OFF
      - name: Build
        run: |
          # Everything the Python tests import (Part, PartDesign, Sketcher, Import), then the API.
          ninja -C build
      - name: Unit tests
        run: build/tests/src/Api/Api_tests_run
      - name: End-to-end tests
        env:
          FREECAD_API_SERVER: build/bin/FreeCADApiServer
        run: python3 src/Api/tests/test_api_server.py -v
